{% extends 'blog/base.html' %}

{% block title %}Редактировать запись{% endblock %}

{% block content %}
<h1 class="text-center mb-4">Редактировать запись</h1>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="{{ form.title.id_for_label }}" class="form-label">Заголовок</label>
                        {{ form.title }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.content.id_for_label }}" class="form-label">Содержимое</label>
                        {{ form.content }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.preview.id_for_label }}" class="form-label">Изображение</label>
                        {{ form.preview }}
                        {% if post.preview %}
                        <div class="mt-2">
                            <small>Текущее изображение:</small>
                            <img src="{{ post.preview.url }}" alt="{{ post.title }}" style="max-height: 100px;">
                        </div>
                        {% endif %}
                    </div>

                    <div class="mb-3 form-check">
                        {{ form.is_published }}
                        <label for="{{ form.is_published.id_for_label }}" class="form-check-label">Опубликовать</label>
                    </div>

                    <button type="submit" class="btn btn-warning">Сохранить</button>
                    <a href="{% url 'blog:blog_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
