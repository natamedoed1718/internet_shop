<!-- Меню слева -->
<div class="col-3 bg-dark-custom d-flex flex-column p-3">
    <h2>Меню</h2>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
               href="{% url 'catalog:home' %}">Главная</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.app_name == 'blog' %}active{% endif %}"
               href="{% url 'blog:blog_list' %}">Блог</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Категории</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'contacts' %}active{% endif %}"
               href="{% url 'catalog:contacts' %}">Контакты</a>
        </li>
    </ul>

    <!-- Кнопка пользователя внизу -->
    <div class="mt-auto">
        <div class="btn-group dropup w-100">
            <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
                Пользователь
            </button>
            <ul class="dropdown-menu w-100">
                <li><a class="dropdown-item" href="#">Профиль</a></li>
                <li><a class="dropdown-item" href="#">Выход</a></li>
            </ul>
        </div>
    </div>
</div>
