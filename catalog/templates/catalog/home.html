<!-- В карточке товара добавь кнопки управления -->
<div class="card" style="width: 18rem;">
    {% if product.image %}
    <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
    {% else %}
    <div class="card-img-top bg-secondary d-flex align-items-center justify-content-center">
        <span class="text-white">Нет изображения</span>
    </div>
    {% endif %}
    <div class="card-body">
        <h5 class="card-title text-center">{{ product.name }}</h5>
        <p class="text-muted text-center small">{{ product.category.name }}</p>
        <h3 class="text-center">${{ product.price }}</h3>
        <p class="text-center">{{ product.description|truncatewords:15 }}</p>
        <div class="text-center">
            <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-primary btn-sm">Подробнее</a>
            <a href="{% url 'catalog:update_product' product.pk %}" class="btn btn-warning btn-sm">✏️</a>
            <a href="{% url 'catalog:delete_product' product.pk %}" class="btn btn-danger btn-sm">🗑️</a>
        </div>
    </div>
</div>
