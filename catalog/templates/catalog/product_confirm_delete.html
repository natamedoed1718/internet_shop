<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Удалить товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .col-3.bg-dark-custom {
            background-color: #2c3e50 !important;
            color: white;
            min-height: 100vh;
        }

        .col-3.bg-dark-custom h2 {
            color: white;
            margin-bottom: 30px;
        }

        .col-3.bg-dark-custom .nav-link {
            color: #ecf0f1 !important;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .col-3.bg-dark-custom .nav-link.active {
            background-color: #34495e !important;
            color: white !important;
        }

        .col-3.bg-dark-custom .nav-link:hover {
            background-color: #34495e !important;
            color: white !important;
        }

        .col-3.bg-dark-custom .btn-secondary {
            background-color: #34495e !important;
            border-color: #34495e !important;
            color: white !important;
        }

        .col-3.bg-dark-custom .btn-secondary:hover {
            background-color: #3d566e !important;
        }

        .col-3.bg-dark-custom .dropdown-menu {
            background-color: #34495e;
            border: none;
        }

        .col-3.bg-dark-custom .dropdown-item {
            color: #ecf0f1;
        }

        .col-3.bg-dark-custom .dropdown-item:hover {
            background-color: #3d566e;
            color: white;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Меню слева -->
        <div class="col-3 bg-dark-custom d-flex flex-column p-3">
            <h2>Меню</h2>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catalog:home' %}">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catalog:add_product' %}">Добавить товар</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catalog:contacts' %}">Контакты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'blog:blog_list' %}">Блог</a>
                </li>
            </ul>

            <div class="mt-auto">
                <div class="btn-group dropup w-100">
                    <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
                        Пользователь
                    </button>
                    <ul class="dropdown-menu w-100">
                        <li><a class="dropdown-item" href="#">Профиль</a></li>
                        <li><a class="dropdown-item" href="#">Выход</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Контент справа -->
        <div class="col-9 bg-light vh-100 overflow-auto p-4">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card border-danger">
                        <div class="card-body text-center">
                            <h1 class="text-danger">🗑️ Удалить товар</h1>
                            <p class="card-text mt-4">
                                Вы уверены, что хотите удалить товар<br>
                                <strong>{{ product.name }}</strong>?
                            </p>
                            <p class="text-muted">Цена: ${{ product.price }}</p>
                            <p class="text-muted">Категория: {{ product.category.name }}</p>

                            <form method="post" class="mt-4">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-danger">Да, удалить</button>
                                <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
